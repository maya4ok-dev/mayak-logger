name: Tests

on:
  push:
    branches: [ development, main ]
  pull_request:
    branches: [ development, main ]

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Install dependencies 
        run : |
          sudo apt-get update
          sudo apt-get install -y clang ninja-build cmake doxygen

      - name: Checkout
        uses: actions/checkout@v4

      - name: Build tests
        run: |
          cmake -B build -G Ninja -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Run tests
        run: |
          cd build/tests
          ctest
