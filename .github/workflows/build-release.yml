name: Build Release

on:
  push:
    tags:
      - 'v*.*.*' # v0.1.0-alpha, v1.0.0, etc.

jobs:
  build:
    name: Build on Linux
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Install build essentials
        run: sudo apt update && sudo apt install -y build-essential cmake clang doxygen graphviz ninja-build

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -G Ninja

      - name: Build
        run: cmake --build build --target all

      - name: Package release
        run: |
          mkdir -p release/{doc,examples,include,lib}
          cp -r build/docs/html/. release/doc
          cp -r examples/* release/examples
          cp -r include/* release/include
          tar -czvf mayak-logger-${{ github.ref_name }}.tar.gz -C release .

      - uses: actions/upload-artifact@v4
        with:
          name: mayak-logger-${{ github.ref_name }}
          path: release/mayak-logger-${{ github.ref_name }}.tar.gz
