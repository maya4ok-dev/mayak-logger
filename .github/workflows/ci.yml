name: CI
on: [push, pull_request]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install dependencies
        run: apt-get update && apt-get install -y cmake g++ make git doxygen graphviz

      - name: Build project
        run: |
          mkdir -p build
          cd build
          cmake ..
          cmake --build .

      - name: Run tests
        run: |
          cd build/tests
          ctest --output-on-failure
